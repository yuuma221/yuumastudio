<canvas id="canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;"></canvas>
<div class="custom-cursor"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const cursor = document.querySelector(".custom-cursor");

let width = window.innerWidth;
let height = window.innerHeight;
canvas.width = width;
canvas.height = height;

// Handle resize
window.addEventListener("resize", () => {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
});

// Mouse position
let mouse = { x: width / 2, y: height / 2 };
window.addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;

    // Move custom cursor
    cursor.style.left = `${mouse.x}px`;
    cursor.style.top = `${mouse.y}px`;
});

// Trail circles
const trailCount = 12;
let trail = new Array(trailCount).fill().map(() => ({ x: mouse.x, y: mouse.y }));

const colors = [
    "#FF8D00", "#E87802", "#D36304", "#BE4E06", "#A93908", "#94240A",
    "#7F1F0B", "#691A0C", "#54150E", "#3F100F", "#2A0B12", "#000016"
]/*.reverse()*/;

function animate() {
    ctx.clearRect(0, 0, width, height);

    // Update trail positions
    trail[0].x += (mouse.x - trail[0].x) * 0.3;
    trail[0].y += (mouse.y - trail[0].y) * 0.3;

    for (let i = 1; i < trail.length; i++) {
        trail[i].x += (trail[i - 1].x - trail[i].x) * 0.4;
        trail[i].y += (trail[i - 1].y - trail[i].y) * 0.4;
    }

    // Draw trail
    trail.forEach((point, index) => {
        const scale = (trail.length - index) / trail.length;
        ctx.beginPath();
        ctx.arc(point.x, point.y, 10 * scale, 0, Math.PI * 2);
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();
</script>

<script>
   $(document).ready(function(){
       $(window).bind('scroll', function() {
           var navHeight = $(window).height() - 700;
           if ($(window).scrollTop() > navHeight) {
               $('nav').addClass('fixed');
               $('.glass').addClass('active');
               
               setTimeout(function(){ 
                   $('nav').css('opacity', '1').css('transform', 'translateY(0)'); 
                   $('.glass').css('opacity', '1').css('transform', 'translateY(0)'); 
               }, 50);
           }
           else {
               $('nav').removeClass('fixed');
               $('.glass').removeClass('active');
               
               $('nav').css('opacity', '0').css('transform', 'translateY(-100%)');
               $('.glass').css('opacity', '0').css('transform', 'translateY(-100%)');
           }
       });
   });
</script>
